version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directories:
      - "/extensions/mssql/python"
      - "/extensions/mssql/test/python"
    groups:
      python-notebooks:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
