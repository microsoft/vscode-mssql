name: Set up MSSQL E2E tests
description: >-
  Builds the MSSQL extension, starts a SQL Server 2025 container, and prepares VS Code for the
  Playwright e2e tests. Exports PASSWORD (the container's sa password) to later steps.
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: ./.github/actions/setup-node

    # SQL Database Projects tests build projects with the .NET SDK.
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.x
        dotnet-quality: "ga"

    - name: Install root dependencies
      shell: bash
      run: npm ci

    # Also installs Playwright's ffmpeg, which records the failure videos.
    - name: MSSQL - Install dependencies and build
      uses: ./.github/actions/build-mssql

    - name: MSSQL - Build webviews
      shell: bash
      working-directory: ./extensions/mssql
      run: npm run build:webviews-bundle

    - name: Start SQL Server
      shell: bash
      run: |
        # `tr | head` ends with SIGPIPE on tr by design; composite steps run with pipefail.
        set +o pipefail
        PASS_LOWER="$(LC_ALL=C tr -dc 'a-z' < /dev/urandom | head -c 1)"
        PASS_UPPER="$(LC_ALL=C tr -dc 'A-Z' < /dev/urandom | head -c 1)"
        PASS_DIGIT="$(LC_ALL=C tr -dc '0-9' < /dev/urandom | head -c 1)"
        PASS_SPECIAL="$(LC_ALL=C tr -dc '!@#^%' < /dev/urandom | head -c 1)"
        PASS_REST="$(LC_ALL=C tr -dc 'A-Za-z0-9!@#^%' < /dev/urandom | head -c 12)"
        PASSWORD="${PASS_LOWER}${PASS_UPPER}${PASS_DIGIT}${PASS_SPECIAL}${PASS_REST}"
        echo "::add-mask::$PASSWORD"
        echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
        docker rm -f mssql-server >/dev/null 2>&1 || true
        docker pull mcr.microsoft.com/mssql/server:2025-latest
        docker run -e "ACCEPT_EULA=Y" -e "MSSQL_PID=Developer" -e "MSSQL_SA_PASSWORD=$PASSWORD" \
          -p 1433:1433 --name mssql-server -d mcr.microsoft.com/mssql/server:2025-latest
        SERVER_READY=false
        for i in {1..30}; do
          if docker logs mssql-server 2>&1 | grep -q "SQL Server is now ready for client connections"; then
            SERVER_READY=true
            break
          fi
          sleep 2
        done
        docker logs mssql-server --tail 50
        if [ "$SERVER_READY" != "true" ]; then
          echo "SQL Server did not become ready in time."
          exit 1
        fi

    - name: Prepare the E2E environment
      shell: bash
      working-directory: ./extensions/mssql
      env:
        VS_CODE_VERSION: stable
      run: node scripts/prepare-e2e-env.js
