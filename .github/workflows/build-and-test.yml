name: Build and Test (Unit + E2E)
# Trigger the workflow on PRs to the main branch.
# It performs the following checks:
# 1. Calculate the size difference between the webview bundles of the main branch and the PR branch.
# 2. Calculate the size difference between the VSIX files of the main branch and the PR branch.
# 3. Does a check if the PR has properly localized strings.

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      AZURE_SQL_CONTAINER_E2E_ENABLED:
        description: Run E2E tests against the Azure SQL Database container
        type: boolean
        required: false
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check if baseline comparison needed
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.base.ref }}" == "main" ]] || [[ "${{ github.event.pull_request.base.ref }}" == release/* ]]; then
            echo "should_compare_baseline=true" >> $GITHUB_ENV
          else
            echo "should_compare_baseline=false" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Test VSIX size comparison
        run: npm run test:repo

      - name: Select baseline for PR base commit
        if: env.should_compare_baseline == 'true'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: node scripts/vsix-size-comparison.mjs select

      - name: Download baseline sizes
        if: env.should_compare_baseline == 'true' && steps.baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          name: baseline-sizes
          path: ./baseline

      - name: Setup .NET Core # Required to execute ReportGenerator
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x
          dotnet-quality: "ga"

      - name: Install root dependencies
        run: |
          npm ci

      - name: Stamp build as pull request version
        run: |
          node scripts/stamp-prerelease-version.mjs "${{ github.run_id }}" --label pr

      - name: MSSQL - Install dependencies and build
        uses: ./.github/actions/build-mssql

      - name: SqlProj - Install dependencies and build
        uses: ./.github/actions/build-sqlproj

      - name: DataWorkspace - Install dependencies and build
        uses: ./.github/actions/build-data-workspace

      - name: Run lint
        run: |
          npm run lint

      - name: Inject extension telemetry key
        env:
          MSSQL_APP_INSIGHTS_KEY: ${{ vars.MSSQL_APP_INSIGHTS_KEY }}
        run: |
          node scripts/inject-telemetry-key.mjs

      # Calculate sizes and package before testing;
      # Testing generates sourcemaps and instrumented code
      # that increase size
      - name: Package extensions
        run: |
          npm run package -- --preview

      - name: MSSQL - Upload VSIX files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mssql-vsix
          path: ./extensions/mssql/*.vsix

      - name: SqlProj - Upload VSIX files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-database-projects-vsix
          path: ./extensions/sql-database-projects/*.vsix

      - name: DataWorkspace - Upload VSIX files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-workspace-vsix
          path: ./extensions/data-workspace/*.vsix

      - name: Keymap - Upload VSIX files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keymap-vsix
          path: ./extensions/database-management-keymap/*.vsix

      - name: Calculate VSIX size comparisons
        if: env.should_compare_baseline == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/vsix-size-comparison.mjs compare

      - name: MSSQL - Run unit tests
        continue-on-error: true
        working-directory: ./extensions/mssql
        run: |
          set +e  # Don't exit on errors
          DISPLAY=:10 npm test
          UNIT_EXIT_CODE=$?
          echo "mssql_unit_tests_pr_exit_code=$UNIT_EXIT_CODE" >> $GITHUB_ENV

      - name: MSSQL - Unit Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: "Unit Test Report"
          path: ./test-reports/**/*.xml
          reporter: jest-junit
          working-directory: ./extensions/mssql
          badge-title: "unit-tests"
          fail-on-error: false

      - name: Build mappings for Webviews
        if: ${{ !inputs.AZURE_SQL_CONTAINER_E2E_ENABLED }}
        continue-on-error: true
        run: |
          cd ./extensions/mssql
          npm run build:webviews-bundle

      - name: Setup environment for smoke tests
        if: ${{ !inputs.AZURE_SQL_CONTAINER_E2E_ENABLED }}
        run: |
          echo "Setting up environment for smoke tests"
          PASS_LOWER="$(LC_ALL=C tr -dc 'a-z' < /dev/urandom | head -c 1)"
          PASS_UPPER="$(LC_ALL=C tr -dc 'A-Z' < /dev/urandom | head -c 1)"
          PASS_DIGIT="$(LC_ALL=C tr -dc '0-9' < /dev/urandom | head -c 1)"
          PASS_SPECIAL="$(LC_ALL=C tr -dc '!@#^%' < /dev/urandom | head -c 1)"
          PASS_REST="$(LC_ALL=C tr -dc 'A-Za-z0-9!@#^%' < /dev/urandom | head -c 12)"
          PASSWORD="${PASS_LOWER}${PASS_UPPER}${PASS_DIGIT}${PASS_SPECIAL}${PASS_REST}"
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
          docker rm -f mssql-server >/dev/null 2>&1 || true
          docker pull mcr.microsoft.com/mssql/server:2025-latest
          docker run -e "ACCEPT_EULA=Y" -e "MSSQL_PID=Developer" -e "MSSQL_SA_PASSWORD=$PASSWORD" \
            -p 1433:1433 --name mssql-server -d mcr.microsoft.com/mssql/server:2025-latest
          SERVER_READY=false
          for i in {1..30}; do
            if docker logs mssql-server 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              SERVER_READY=true
              break
            fi
            sleep 2
          done
          docker logs mssql-server --tail 50
          if [ "$SERVER_READY" != "true" ]; then
            echo "SQL Server did not become ready in time."
            exit 1
          fi
        working-directory: ./extensions/mssql

      - name: Run smoke tests
        if: ${{ !inputs.AZURE_SQL_CONTAINER_E2E_ENABLED }}
        continue-on-error: true
        run: |
          set +e  # Don't exit on errors
          export VS_CODE_VERSION=stable
          export SERVER_NAME=localhost
          export AUTHENTICATION_TYPE="SQL Login"
          export USER_NAME=sa
          export PASSWORD=${{ env.PASSWORD }}
          export SAVE_PASSWORD=No
          export PROFILE_NAME=test-server
          export BUILT_VSIX_PATH=$(find ./extensions/mssql -name "*.vsix" -exec realpath {} \; | head -n 1)
          DISPLAY=:10 npm run smoketest -- --target mssql
          SMOKE_EXIT_CODE=$?
          echo "mssql_smoke_tests_pr_exit_code=$SMOKE_EXIT_CODE" >> $GITHUB_ENV

      - name: Upload Smoke Test Screenshots and Videos
        if: ${{ !inputs.AZURE_SQL_CONTAINER_E2E_ENABLED }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-failure-screenshots
          path: ./extensions/mssql/test-results/**/
          retention-days: 7

      - name: Smoke Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !inputs.AZURE_SQL_CONTAINER_E2E_ENABLED && (success() || failure()) }}
        with:
          name: "Smoke Test Report"
          path: ./test-reports/**/smoke-results.xml
          reporter: jest-junit
          working-directory: ./extensions/mssql
          badge-title: "smoke-tests"
          fail-on-error: false

      - name: Merge Smoke and Unit Test Coverage Reports
        if: ${{ !inputs.AZURE_SQL_CONTAINER_E2E_ENABLED }}
        run: |
          if [ -f extensions/mssql/test/resources/mergeReports.js ]; then
            node extensions/mssql/test/resources/mergeReports.js extensions/mssql/coverage/coverage-e2e/cobertura-coverage.xml extensions/mssql/coverage/cobertura-coverage.xml
          else
            echo "mergeReports.js not found, skipping..."
          fi

      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "./extensions/mssql/coverage/cobertura-coverage.xml"
          targetdir: "coveragereport"
          reporttypes: "Html"
          toolpath: "reportgeneratortool"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CoverageReport
          path: coveragereport

      - name: MSSQL - Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./extensions/mssql/coverage/cobertura-coverage.xml
          flags: mssql

      - name: Find comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        if: env.should_compare_baseline == 'true'
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: |
            ### PR Changes

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: env.should_compare_baseline == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./results.md
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace

      - name: Generate xliff files
        run: |
          npm run localization

      # Check if there are git changes in english xlf files
      - name: Check for changes in localization files
        run: |
          CHANGES_FOUND=false

          if ! git diff --quiet --exit-code ./localization/xliff/vscode-mssql.xlf; then
            echo "Changes found in vscode-mssql.xlf"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./localization/xliff/sql-database-projects.xlf; then
            echo "Changes found in sql-database-projects.xlf"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./extensions/mssql/l10n/bundle.l10n.json; then
            echo "Changes found in mssql bundle.l10n.json"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./extensions/sql-database-projects/l10n/bundle.l10n.json; then
            echo "Changes found in sql-database-projects bundle.l10n.json"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./localization/xliff/data-workspace.xlf; then
            echo "Changes found in data-workspace.xlf"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./extensions/data-workspace/l10n/bundle.l10n.json; then
            echo "Changes found in data-workspace bundle.l10n.json"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./localization/xliff/extension-toolkit.xlf; then
            echo "Changes found in extension-toolkit.xlf"
            CHANGES_FOUND=true
          fi

          if ! git diff --quiet --exit-code ./packages/extension-toolkit/l10n/bundle.l10n.json; then
            echo "Changes found in extension-toolkit bundle.l10n.json"
            CHANGES_FOUND=true
          fi

          if [ "$CHANGES_FOUND" = "true" ]; then
            echo "loc_update_required=true" >> $GITHUB_ENV
          else
            echo "Changes not found in any localization files"
            echo "loc_update_required=false" >> $GITHUB_ENV
          fi

      - name: Find comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        if: github.event_name == 'pull_request'
        id: loc-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: |
            # Updates to localized strings required

      - name: Create or update comment
        if: github.event_name == 'pull_request' && env.loc_update_required == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.loc-comment.outputs.comment-id }}
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # Updates to localized strings required
              Please update the localized strings in the PR with following steps:
              1. Run `npm run localization` from the root directory of the PR branch.
              2. Commit the updated localization files:
                  * XLIFF files: `localization/xliff/*.xlf`
                  * Bundle files: `extensions/*/l10n/bundle.l10n.json` and `packages/extension-toolkit/l10n/bundle.l10n.json`

              The localization system extracts strings from all configured extensions and packages to a centralized location.
          edit-mode: replace

      - name: Delete comment
        if: ${{ github.event_name == 'pull_request' && env.loc_update_required == 'false' && steps.loc-comment.outputs.comment-id != '' }}
        run: |
          curl -X DELETE \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ steps.loc-comment.outputs.comment-id }}

      - name: Fail pipeline if any checks failed
        if: always()
        run: |
          # Initialize failure flag
          PIPELINE_FAILED=false

          echo "Checking pipeline results..."

          # Check MSSQL unit tests
          if [ "${{ env.mssql_unit_tests_pr_exit_code }}" != "0" ] && [ "${{ env.mssql_unit_tests_pr_exit_code }}" != "" ]; then
            echo "  ❌ MSSQL unit tests failed with exit code ${{ env.mssql_unit_tests_pr_exit_code }}"
            PIPELINE_FAILED=true
          fi

          # Check MSSQL smoke tests
          if [ "${{ env.mssql_smoke_tests_pr_exit_code }}" != "0" ] && [ "${{ env.mssql_smoke_tests_pr_exit_code }}" != "" ]; then
            echo "  ❌ MSSQL smoke tests failed with exit code ${{ env.mssql_smoke_tests_pr_exit_code }}"
            PIPELINE_FAILED=true
          fi

          # Check MSSQL VSIX percentage change (if variables exist)
          if [ "${{ env.mssql_vsix_percentage_change }}" != "" ] && [ $(echo "${{ env.mssql_vsix_percentage_change }} > 5" | bc -l) -eq 1 ]; then
            echo "  ❌ MSSQL VSIX size increased by more than 5% (${{ env.mssql_vsix_percentage_change }}%)"
            PIPELINE_FAILED=true
          fi

          # Check SqlProj VSIX percentage change (if variables exist)
          if [ "${{ env.sqlproj_vsix_percentage_change }}" != "" ] && [ $(echo "${{ env.sqlproj_vsix_percentage_change }} > 5" | bc -l) -eq 1 ]; then
            echo "  ❌ SqlProj VSIX size increased by more than 5% (${{ env.sqlproj_vsix_percentage_change }}%)"
            PIPELINE_FAILED=true
          fi

          # Check DataWorkspace VSIX percentage change (if variables exist)
          if [ "${{ env.dataworkspace_vsix_percentage_change }}" != "" ] && [ $(echo "${{ env.dataworkspace_vsix_percentage_change }} > 5" | bc -l) -eq 1 ]; then
            echo "  ❌ DataWorkspace VSIX size increased by more than 5% (${{ env.dataworkspace_vsix_percentage_change }}%)"
            PIPELINE_FAILED=true
          fi

          # Check localization
          if [ "${{ env.loc_update_required }}" = "true" ]; then
            echo "  ❌ Updates to localized strings are required"
            PIPELINE_FAILED=true
          fi

          # Fail if any issues were found
          if [ "$PIPELINE_FAILED" = "true" ]; then
            echo ""
            echo "Pipeline failed due to the above issues."
            exit 1
          else
            echo "  ✅ All checks passed!"
          fi

  azure-sql-container-e2e:
    name: Azure SQL container E2E
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.AZURE_SQL_CONTAINER_E2E_ENABLED &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      AZURE_SQL_CONTAINER_REGISTRY: sqldbpreview-dpgaeqhmgphzd4bk.azurecr.io
      AZURE_SQL_CONTAINER_IMAGE: sqldbpreview-dpgaeqhmgphzd4bk.azurecr.io/azure-sql/db-dev:latest
      VS_CODE_VERSION_NAME: stable
      SERVER_NAME: "127.0.0.1"
      DATABASE_NAME: mssql_e2e
      AUTHENTICATION_TYPE: SQL Login
      USER_NAME: sa
      SAVE_PASSWORD: "No"
      PROFILE_NAME: test-azure-sql
      E2E_USE_VSIX: "true"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Sign in to Azure SQL preview registry
        env:
          REGISTRY_USERNAME: ${{ secrets.AZURE_SQL_CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.AZURE_SQL_CONTAINER_REGISTRY_PASSWORD }}
        run: |
          if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
            echo "::error::Azure SQL container E2E requires AZURE_SQL_CONTAINER_REGISTRY_USERNAME and AZURE_SQL_CONTAINER_REGISTRY_PASSWORD secrets."
            exit 1
          fi
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$AZURE_SQL_CONTAINER_REGISTRY" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Download MSSQL VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mssql-vsix
          path: ./extensions/mssql/azure-sql-vsix

      - name: Install E2E system dependencies
        working-directory: ./extensions/mssql
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev pkg-config libsecret-1-dev libkrb5-dev \
            libxss1 dbus xvfb libgtk-3-0 libgbm1
          npx playwright install --with-deps

      - name: Start Azure SQL container and provision test database
        run: |
          PASSWORD="Aa1%$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          export SQLCMDPASSWORD="$PASSWORD"
          docker pull "$AZURE_SQL_CONTAINER_IMAGE"
          docker run --name azure-sql-e2e \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$PASSWORD" \
            -p 127.0.0.1:1433:1433 -d "$AZURE_SQL_CONTAINER_IMAGE"

          SERVER_READY=false
          for i in {1..150}; do
            if docker exec -e SQLCMDPASSWORD azure-sql-e2e /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -C -l 2 -b -Q "SELECT 1;" > /dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' azure-sql-e2e)" != "true" ]]; then
              echo "::error::Azure SQL container exited before becoming ready."
              exit 1
            fi
            sleep 2
          done
          if [[ "$SERVER_READY" != "true" ]]; then
            echo "::error::Azure SQL container did not become ready in time."
            exit 1
          fi

          docker exec -e SQLCMDPASSWORD azure-sql-e2e /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -Q "CREATE DATABASE [$DATABASE_NAME];"
          docker exec -e SQLCMDPASSWORD azure-sql-e2e /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d "$DATABASE_NAME" \
            -Q "IF CONVERT(int, SERVERPROPERTY('EngineEdition')) <> 5 THROW 51000, 'Expected Azure SQL Database engine.', 1; SELECT DB_NAME() AS database_name, @@VERSION AS engine_version;"

      - name: Run Azure SQL E2E tests
        working-directory: ./extensions/mssql
        run: |
          mapfile -t VSIX_FILES < <(find "$PWD/azure-sql-vsix" -name "*.vsix" -type f)
          if [[ "${#VSIX_FILES[@]}" != "1" ]]; then
            echo "::error::Expected exactly one MSSQL VSIX artifact."
            exit 1
          fi
          export BUILT_VSIX_PATH="${VSIX_FILES[0]}"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            bash -c 'node scripts/prepare-e2e-env.js && npx playwright test'

      - name: Azure SQL E2E test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Azure SQL container E2E report
          path: ./extensions/mssql/test-reports/smoke-results.xml
          reporter: jest-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Collect Azure SQL container diagnostics
        if: ${{ !cancelled() }}
        run: |
          mkdir -p azure-sql-diagnostics
          if docker container inspect azure-sql-e2e > /dev/null 2>&1; then
            docker logs azure-sql-e2e > azure-sql-diagnostics/container.log 2>&1
            docker inspect --format '{{.Image}} {{.State.Status}} {{.State.ExitCode}}' \
              azure-sql-e2e > azure-sql-diagnostics/container-state.txt
            docker image inspect --format '{{json .RepoDigests}}' "$AZURE_SQL_CONTAINER_IMAGE" \
              > azure-sql-diagnostics/image-digests.json
          fi

      - name: Upload Azure SQL E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-sql-container-e2e-results
          path: |
            ./extensions/mssql/test-reports/
            ./extensions/mssql/test-results/
            ./azure-sql-diagnostics/
          retention-days: 7

      - name: Clean up Azure SQL container and registry session
        if: always()
        run: |
          if docker container inspect azure-sql-e2e > /dev/null 2>&1; then
            docker rm -f azure-sql-e2e
          fi
          docker logout "$AZURE_SQL_CONTAINER_REGISTRY"
