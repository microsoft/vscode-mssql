# Runs the MSSQL end-to-end tests tagged @quarantine.
#
# Tests land in quarantine when they fail or are flaky in the build-and-test smoke run. That run
# leaves them out (see E2E_QUARANTINE in extensions/mssql/playwright.config.ts), and this workflow
# runs only them, without retries, so a flaky test reports as a failure here rather than passing
# on a retry. Its result does not affect build-and-test.
#
# To promote a test, delete its `tag: "@quarantine"` once it passes consistently in this
# workflow; the job summary lists every quarantined test's result. Failed attempts upload a
# video clip, a trace with screenshots and DOM snapshots, and a screenshot.
name: E2E Quarantine

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/e2e-quarantine.yml"
      - "extensions/mssql/playwright.config.ts"
      - "extensions/mssql/scripts/e2e-quarantine-summary.js"
      - "extensions/mssql/test/e2e/**"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-quarantine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quarantined-e2e-tests:
    name: Quarantined E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      # SQL Database Projects tests build projects with the .NET SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x
          dotnet-quality: "ga"

      - name: Install root dependencies
        run: npm ci

      # Also installs Playwright's ffmpeg, which records the failure videos.
      - name: MSSQL - Install dependencies and build
        uses: ./.github/actions/build-mssql

      - name: MSSQL - Build webviews
        working-directory: ./extensions/mssql
        run: npm run build:webviews-bundle

      - name: Start SQL Server
        run: |
          PASS_LOWER="$(LC_ALL=C tr -dc 'a-z' < /dev/urandom | head -c 1)"
          PASS_UPPER="$(LC_ALL=C tr -dc 'A-Z' < /dev/urandom | head -c 1)"
          PASS_DIGIT="$(LC_ALL=C tr -dc '0-9' < /dev/urandom | head -c 1)"
          PASS_SPECIAL="$(LC_ALL=C tr -dc '!@#^%' < /dev/urandom | head -c 1)"
          PASS_REST="$(LC_ALL=C tr -dc 'A-Za-z0-9!@#^%' < /dev/urandom | head -c 12)"
          PASSWORD="${PASS_LOWER}${PASS_UPPER}${PASS_DIGIT}${PASS_SPECIAL}${PASS_REST}"
          echo "::add-mask::$PASSWORD"
          echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          docker rm -f mssql-server >/dev/null 2>&1 || true
          docker pull mcr.microsoft.com/mssql/server:2025-latest
          docker run -e "ACCEPT_EULA=Y" -e "MSSQL_PID=Developer" -e "MSSQL_SA_PASSWORD=$PASSWORD" \
            -p 1433:1433 --name mssql-server -d mcr.microsoft.com/mssql/server:2025-latest
          SERVER_READY=false
          for i in {1..30}; do
            if docker logs mssql-server 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              SERVER_READY=true
              break
            fi
            sleep 2
          done
          docker logs mssql-server --tail 50
          if [ "$SERVER_READY" != "true" ]; then
            echo "SQL Server did not become ready in time."
            exit 1
          fi

      - name: Prepare the E2E environment
        working-directory: ./extensions/mssql
        env:
          VS_CODE_VERSION: stable
        run: node scripts/prepare-e2e-env.js

      - name: Run quarantined E2E tests
        working-directory: ./extensions/mssql
        env:
          E2E_QUARANTINE: only
          ENABLE_ELECTRON_VIDEO_RECORDING: "true"
          VS_CODE_VERSION: stable
          SERVER_NAME: localhost
          AUTHENTICATION_TYPE: SQL Login
          USER_NAME: sa
          SAVE_PASSWORD: "No"
          PROFILE_NAME: test-server
        run: DISPLAY=:10 npx playwright test

      - name: Publish per-test results
        if: ${{ !cancelled() }}
        working-directory: ./extensions/mssql
        run: node scripts/e2e-quarantine-summary.js ./test-reports/quarantine-results.json

      - name: Upload failure videos, traces, and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-quarantine-failure-artifacts
          path: ./extensions/mssql/test-results/**/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-quarantine-reports
          path: |
            ./extensions/mssql/test-reports/quarantine-results.xml
            ./extensions/mssql/test-reports/quarantine-results.json
            ./extensions/mssql/test-reports/quarantine-html/
          if-no-files-found: ignore
          retention-days: 14
