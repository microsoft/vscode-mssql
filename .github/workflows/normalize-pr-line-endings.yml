name: Normalize PR Line Endings

on:
  workflow_run:
    workflows: ["Queue PR Line-Ending Normalization"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: normalize-pr-line-endings-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize JSON, XML, and XLF files
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Read current PR details
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const number = context.payload.workflow_run.pull_requests[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });

            const sameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;

            core.setOutput("should-normalize", pr.state === "open" && sameRepository);
            core.setOutput("head-ref", pr.head.ref);
            core.setOutput("head-repository", pr.head.repo?.full_name ?? "");

      - name: Checkout PR branch
        if: steps.pr.outputs.should-normalize == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pr.outputs.head-repository }}
          ref: ${{ steps.pr.outputs.head-ref }}
          token: ${{ secrets.LINE_ENDING_BOT_TOKEN || github.token }}

      - name: Normalize line endings
        if: steps.pr.outputs.should-normalize == 'true'
        id: normalize
        shell: bash
        run: |
          git add --renormalize -- '*.json' '*.xml' '*.xlf'

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize line endings"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push normalized files
        if: steps.normalize.outputs.changed == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
        run: git push origin "HEAD:${HEAD_REF}"
